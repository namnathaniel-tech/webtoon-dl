<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webtoon Downloader</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #fff; --text: #1f1f1f; --muted: #6b6b6b; --line: #e4e4e0;
    --accent: #00b84c; --accent-ink: #fff; --danger: #d64545; --hover: #f0f0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --panel: #222; --text: #e8e8e8; --muted: #9a9a9a; --line: #333;
            --accent: #22c55e; --accent-ink: #0b0b0b; --danger: #f87171; --hover: #2a2a2a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 4px; font-weight: 650; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  input[type=text], select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
         border-radius: 6px; padding: 8px 10px; outline: none; }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  #url { flex: 1; min-width: 220px; }
  button { font: inherit; border: 1px solid var(--line); background: var(--panel); color: var(--text);
           border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover:not(:disabled) { background: var(--hover); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { filter: brightness(1.05); background: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; margin-top: 16px; }
  .series-head { display: flex; gap: 14px; padding: 14px; border-bottom: 1px solid var(--line); align-items: center; }
  .series-head img { width: 72px; height: 72px; object-fit: cover; border-radius: 6px; background: var(--hover); }
  .series-head h2 { font-size: 17px; margin: 0 0 2px; }
  .muted { color: var(--muted); }
  .toolbar { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=number] { width: 72px; font: inherit; color: inherit; background: var(--panel);
                                border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  .toolbar button { padding: 6px 10px; }
  .eps { max-height: 380px; overflow-y: auto; }
  .ep { display: flex; gap: 10px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; }
  .ep:last-child { border-bottom: 0; }
  .ep:hover { background: var(--hover); }
  .ep .no { width: 44px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ep .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ep.locked { opacity: .45; cursor: default; }
  .tag { font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
  .foot { padding: 12px 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); }
  .foot #outDir { flex: 1; min-width: 200px; }
  .err { color: var(--danger); margin-top: 10px; min-height: 1em; }
  .bar { height: 6px; background: var(--hover); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .bar > div { height: 100%; background: var(--accent); width: 0; transition: width .3s; }
  .job { padding: 14px; }
  .log { max-height: 260px; overflow-y: auto; font-size: 13px; }
  .log div { padding: 3px 0; display: flex; gap: 8px; }
  .log .s-done { color: var(--accent); } .log .s-failed { color: var(--danger); }
  .hidden { display: none !important; }
  .spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  a { color: var(--accent); cursor: pointer; }
</style>
</head>
<body>
<main>
  <h1>Webtoon Downloader</h1>
  <p class="sub">Paste a series or episode link from comic.naver.com, webtoons.com or mangadex.org. Only free episodes are downloaded.</p>

  <form class="row" id="loadForm">
    <input id="url" type="text" placeholder="https://comic.naver.com/webtoon/list?titleId=…" autocomplete="off" autofocus>
    <select id="lang" class="hidden" title="MangaDex translation language"></select>
    <button class="primary" id="loadBtn" type="submit">Load</button>
  </form>
  <div class="err" id="err"></div>

  <section class="panel hidden" id="seriesPanel">
    <div class="series-head">
      <img id="thumb" alt="">
      <div>
        <h2 id="title"></h2>
        <div class="muted" id="meta"></div>
      </div>
    </div>
    <div class="toolbar">
      <button id="selAll" type="button">All</button>
      <button id="selNone" type="button">None</button>
      <span class="muted">Range</span>
      <input type="number" id="rFrom" min="1"> – <input type="number" id="rTo" min="1">
      <button id="selRange" type="button">Select range</button>
      <span class="muted" id="selCount" style="margin-left:auto"></span>
    </div>
    <div class="eps" id="eps"></div>
    <div class="foot">
      <select id="format">
        <option value="images">Images (folder per episode)</option>
        <option value="cbz">CBZ (comic reader file)</option>
        <option value="pdf">PDF</option>
      </select>
      <input type="text" id="outDir" title="Save to">
      <button class="primary" id="dlBtn" type="button">Download</button>
    </div>
  </section>

  <section class="panel hidden" id="jobPanel">
    <div class="job">
      <div class="row" style="justify-content:space-between">
        <strong id="jobTitle"></strong>
        <span>
          <a id="openFolder" class="hidden">Open folder</a>
          <button id="cancelBtn" type="button" style="margin-left:8px">Cancel</button>
        </span>
      </div>
      <div class="bar"><div id="barFill"></div></div>
      <div class="muted" id="jobStatus"></div>
      <div class="log" id="log"></div>
    </div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let series = null, selected = new Set(), jobId = null, pollTimer = null, config = {};

async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) } : {});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}

fetch("/api/config").then(r => r.json()).then(c => {
  config = c; $("outDir").value = c.outDir;
  if (!c.pdf) { const o = $("format").querySelector('[value=pdf]'); o.disabled = true; o.textContent += " — needs Pillow"; }
});

const LANG_NAMES = { en: "English", ko: "Korean", ja: "Japanese", "ja-ro": "Japanese (romaji)", es: "Spanish",
  "es-la": "Spanish (LatAm)", fr: "French", de: "German", it: "Italian", "pt-br": "Portuguese (BR)", pt: "Portuguese",
  ru: "Russian", id: "Indonesian", vi: "Vietnamese", th: "Thai", tr: "Turkish", pl: "Polish", ar: "Arabic",
  zh: "Chinese", "zh-hk": "Chinese (HK)", uk: "Ukrainian", fil: "Filipino", ms: "Malay" };
let lastUrl = "";
const isMangaDex = u => /mangadex\.org/i.test(u);
function setLangOptions(langs, current) {
  const sel = $("lang"); sel.innerHTML = "";
  for (const l of (langs.length ? langs : [current || "en"])) {
    const o = document.createElement("option"); o.value = l; o.textContent = LANG_NAMES[l] || l; sel.appendChild(o);
  }
  sel.value = current;
}
$("url").addEventListener("input", () => {
  const md = isMangaDex($("url").value);
  $("lang").classList.toggle("hidden", !md);
  if (md && !$("lang").options.length) setLangOptions(["en"], "en");
});
$("lang").onchange = () => { if (series && series.site === "mangadex") $("loadForm").requestSubmit(); };

$("loadForm").onsubmit = async e => {
  e.preventDefault();
  const url = $("url").value.trim(); if (!url) return;
  $("err").textContent = ""; $("loadBtn").disabled = true;
  $("loadBtn").innerHTML = '<span class="spinner"></span> Loading';
  // new link → let the server pick the language (from a chapter link, or English)
  const lang = isMangaDex(url) && url === lastUrl ? $("lang").value : "";
  try {
    series = await api("/api/series", { url, lang });
    lastUrl = url;
    if (series.site === "mangadex") { setLangOptions(series.languages, series.lang); $("lang").classList.remove("hidden"); }
    renderSeries();
  } catch (err) { $("err").textContent = err.message; $("seriesPanel").classList.add("hidden"); }
  finally { $("loadBtn").disabled = false; $("loadBtn").textContent = "Load"; }
};

function renderSeries() {
  $("seriesPanel").classList.remove("hidden");
  $("title").textContent = series.title;
  const free = series.episodes.filter(e => !e.locked).length;
  const siteName = { naver: "Naver Webtoon", webtoons: "WEBTOON", mangadex: "MangaDex" }[series.site];
  const unit = series.site === "mangadex" ? "chapters" : "episodes";
  $("meta").textContent = `${siteName} · ${series.episodes.length} ${unit}` +
    (series.site === "mangadex" ? ` · ${LANG_NAMES[series.lang] || series.lang}` : "") +
    (free < series.episodes.length ? ` · ${free} downloadable` : "");
  if (!series.episodes.length) $("err").textContent = "No chapters in this language. Try another one from the language menu.";
  $("thumb").src = series.thumbnail ? "/api/thumb?u=" + encodeURIComponent(series.thumbnail) : "";
  const nos = series.episodes.map(e => e.no);
  $("rFrom").value = nos.length ? Math.min(...nos) : ""; $("rTo").value = nos.length ? Math.max(...nos) : "";
  // preselect the episode from the link, if any
  selected = new Set();
  const m = $("url").value.match(/[?&](?:no|episode_no)=(\d+)/);
  if (series.preselect) selected.add(series.preselect);
  else if (m && nos.includes(+m[1])) selected.add(+m[1]);
  const box = $("eps"); box.innerHTML = "";
  for (const ep of series.episodes) {
    const row = document.createElement("label");
    row.className = "ep" + (ep.locked ? " locked" : "");
    row.innerHTML = `<input type="checkbox" ${ep.locked ? "disabled" : ""}><span class="no">${ep.no}</span><span class="t"></span>` +
      (ep.locked ? '<span class="tag">locked</span>' : "");
    row.querySelector(".t").textContent = ep.title;
    const cb = row.querySelector("input"); cb.dataset.no = ep.no; cb.checked = selected.has(ep.no);
    cb.onchange = () => { cb.checked ? selected.add(ep.no) : selected.delete(ep.no); updateCount(); };
    box.appendChild(row);
  }
  updateCount();
}

function setSel(pred) {
  selected = new Set(series.episodes.filter(e => !e.locked && pred(e)).map(e => e.no));
  $("eps").querySelectorAll("input").forEach(cb => cb.checked = selected.has(+cb.dataset.no));
  updateCount();
}
function updateCount() { $("selCount").textContent = `${selected.size} selected`; $("dlBtn").disabled = !selected.size; }
$("selAll").onclick = () => setSel(() => true);
$("selNone").onclick = () => setSel(() => false);
$("selRange").onclick = () => { const a = +$("rFrom").value, b = +$("rTo").value; setSel(e => e.no >= a && e.no <= b); };

$("dlBtn").onclick = async () => {
  $("err").textContent = "";
  try {
    const r = await api("/api/download", { key: series.key, episodes: [...selected].sort((a,b)=>a-b),
                                           format: $("format").value, outDir: $("outDir").value });
    jobId = r.jobId; $("jobPanel").classList.remove("hidden"); $("cancelBtn").classList.remove("hidden");
    $("openFolder").classList.add("hidden"); $("dlBtn").disabled = true;
    poll();
  } catch (err) { $("err").textContent = err.message; }
};

$("cancelBtn").onclick = () => api("/api/cancel", { jobId });
$("openFolder").onclick = () => api("/api/reveal", { path: $("openFolder").dataset.path }).catch(e => $("err").textContent = e.message);

async function poll() {
  clearTimeout(pollTimer);
  const j = await api("/api/jobs/" + jobId);
  $("jobTitle").textContent = j.title;
  $("barFill").style.width = (100 * j.done / j.total) + "%";
  const failed = j.items.filter(i => i.state === "failed").length;
  const cur = j.items.find(i => i.state === "downloading");
  $("jobStatus").textContent = j.status === "running"
    ? `${j.done} / ${j.total} episodes` + (cur ? ` — episode ${cur.no} (${cur.images} images)` : "")
    : `${j.status === "cancelled" ? "Cancelled" : "Finished"}: ${j.done - failed} saved` + (failed ? `, ${failed} failed` : "");
  $("log").innerHTML = "";
  for (const it of [...j.items].reverse()) {
    const d = document.createElement("div");
    d.innerHTML = `<span class="s-${it.state}">${it.state === "done" ? "✓" : it.state === "failed" ? "✕" : '<span class="spinner"></span>'}</span><span></span>`;
    d.lastChild.textContent = `${it.no} ${it.title}` + (it.error ? ` — ${it.error}` : "");
    $("log").appendChild(d);
  }
  if (j.status === "running") pollTimer = setTimeout(poll, 700);
  else {
    $("cancelBtn").classList.add("hidden"); $("dlBtn").disabled = !selected.size;
    $("openFolder").dataset.path = j.outDir; $("openFolder").classList.remove("hidden");
  }
}
</script>
</body>
</html>
